<!DOCTYPE html>
<html lang="{{ locale_name }}">
<head>
    <title>{{ head.title }}</title>
    {{{ head.meta_tags }}}
    {{{ head.config }}}

    <link href="{{ head.favicon }}" rel="shortcut icon">
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('cwt-theme');
                var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.classList.add(theme === 'light' ? 'cwt-theme-light' : 'cwt-theme-dark');
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.documentElement.classList.add('cwt-theme-dark');
            }
        })();
    </script>
    {{#block "head"}}{{/block}}
</head>
<body>
    {{#block "page"}}{{/block}}
</body>
</html>
