<div class="cwt-header-icons">
    <div class="items item--theme-toggle">
        <button type="button"
            class="cwt-theme-toggle"
            data-cwt-theme-toggle
            aria-label="Toggle light and dark theme"
            title="Toggle theme">
            <span class="cwt-theme-toggle__track" aria-hidden="true">
                <span class="cwt-theme-toggle__thumb"></span>
            </span>
            <span class="cwt-theme-toggle__icon cwt-theme-toggle__icon--sun" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </span>
            <span class="cwt-theme-toggle__icon cwt-theme-toggle__icon--moon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
            </span>
        </button>
    </div>
    <div class="items item--account">
        {{#if customer}}
            <a class="navUser-action cwt-header-action-row account-name" href="{{urls.account.index}}" data-login-form aria-label="{{customer.name}}">
                <div class="navUser-icon">
                    {{> components/halothemes/header/cwt-account-icon}}
                </div>
            </a>
        {{else}}
            <a class="navUser-action cwt-header-action-row" href="{{urls.auth.login}}" data-login-form aria-label="{{lang 'common.login'}}">
                <div class="navUser-icon">
                    {{> components/halothemes/header/cwt-account-icon}}
                </div>
            </a>
        {{/if}}
    </div>
    <div class="items item--wishlist">
        <a class="navUser-action cwt-header-action-row" href="{{urls.account.wishlists.all}}" aria-label="{{lang 'account.wishlists.heading'}}">
            <div class="navUser-icon">
                <svg class="icon" title="icon heart"><use xlink:href="#icon-heart"></use></svg>
            </div>
        </a>
    </div>
    <div class="items item--cart header-cart">
        <a class="navUser-action cwt-header-action-row"
            data-cart-preview
            data-options="align:right"
            href="{{urls.cart}}"
            data-label="{{lang 'common.cart'}}"
            aria-label="{{lang 'common.cart'}}">
            <div class="navUser-icon navUser-item-cartIcon">
                <svg class="icon" role="img" aria-label="{{lang 'cart.cart_preview'}}">
                    <title>{{lang 'cart.cart_preview'}}</title>
                    <desc>{{lang 'cart.cart_preview'}}</desc>
                    <use xlink:href="#icon-cart"></use>
                </svg>
            </div>
            <span class="countPill{{#if cart.items}} countPill--positive{{/if}} cart-quantity">{{#if cart.items}}{{cart.quantity}}{{else}}0{{/if}}</span>
        </a>
    </div>
</div>
