<div class="footer-certificate" data-halo-load="init-carousel">
    {{#if theme_settings.halo_footer_certificate_img1}}
        <div class="item">
            <a href="{{theme_settings.halo_footer_certificate_link1}}" aria-label="Certificate Image 1">
                <img src="https://cdn11.bigcommerce.com/s-{{settings.store_hash}}/images/stencil/original/image-manager/{{theme_settings.halo_footer_certificate_img1}}" alt="Certificate Image 1">
            </a>
        </div>
    {{/if}}
    {{#if theme_settings.halo_footer_certificate_img2}}
        <div class="item">
            <a href="{{theme_settings.halo_footer_certificate_link2}}" aria-label="Certificate Image 2">
                <img src="https://cdn11.bigcommerce.com/s-{{settings.store_hash}}/images/stencil/original/image-manager/{{theme_settings.halo_footer_certificate_img2}}" alt="Certificate Image 2">
            </a>
        </div>
    {{/if}}
</div>
